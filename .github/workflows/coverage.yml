name: Coverage Report
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      test_path: 'test'
      coverage_source: 'ovos_tts_transformer_audiosr'
      install_extras: '.[test]'
